<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f6b5c"><title>UrbanMind</title>
<style>body{margin:0;background:#f6f4ef;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;color:#0f6b5c}</style></head>
<body><div>جاري التحميل...</div>
<script>
(function(){var N=21,P=[];for(var i=0;i<N;i++)P.push(fetch('c'+(i<10?'0':'')+i+'.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}));
Promise.all(P).then(function(a){document.open();document.write(a.map(function(x){return x.replace(/\n$/,'')}).join(''));document.close()}).catch(function(e){document.body.innerHTML='<p style="padding:20px">تعذر التحميل، حدّث الصفحة. ('+e.message+')</p>'})})();
</script></body></html>
